# YOLO26 P3-P5 с инъекцией деталей P2/4 в узел P3 — КОНТРОЛЬНАЯ ветка к yolo26-uav.yaml, не замена ей.
# РЕШЕНИЕ. Открытый вопрос, который нельзя закрыть на бумаге: провал recall <16 px (4.7 %) — это геометрия
# (нужен stride 4) или качество признаков? Этот файл проверяет вторую гипотезу честно: уровня Detect на stride 4 нет,
# но узел P3 дополнительно получает карту backbone-P2 (слой 2), сжатую обучаемым SCDown, — то есть деталь со stride 4
# без четвёртого выхода и без учетверения числа якорей. Голова при этом не сужается: ch[0] = P3 = 256*w -> c2/c3 = 32/128 (s).
# Геометрия выходов бит-в-бит как у базовой yolo26 (strides 8/16/32, 19,320 якорей) — TensorRT-обвязка и пороги трекера переносятся как есть.
#
# ИЗМЕРЕНО (nc=1, thop; «deploy» — fused, one2one, letterbox 736x1280):
#   scale s: 9,983,070 par, 23.8 / 98.3 GF, deploy 50.9 GF, c2/c3 = 32/128, strides [8,16,32], 19,320 якорей
#   против yolo26s 9,948,638 / 22.7 / 93.9 / 48.5 — вся инъекция стоит +34k параметров и +4.9 % deploy
#   против yolo26-uav.yaml (P2) 10,258,600 / 35.1 / 143.3 / 66.5 — эта ветка на 23 % дешевле в деплое
#   перенос yolo26s.pt (scale s): 59.3 % «как есть», 99.0 % после ремапа, one2one 99.9 %
#   ремап = model.i -> model.(i+1) для ВСЕХ i >= 15 (yolo26 15..23 -> 16..24), включая Detect 23 -> 24;
#   именно это делает _remap_alt в load_uav_weights.py. Слой 16 (C3k2) переносится частично: его cv1 в alt
#   принимает 640 каналов вместо 512, поэтому по форме отсекается только первая свёртка блока.
#   ONNX opset 19: 1x3x736x1280 -> (1, 300, 6), 687 узлов, onnx.checker OK
#
# КОГДА БРАТЬ ЭТОТ ФАЙЛ, А НЕ yolo26-uav.yaml — см. RECIPE-uav.md, раздел «развилка». Коротко:
#   1) всегда — как вторая обучающая ветка на тех же данных и том же расписании: она изолирует «геометрия vs признаки»;
#   2) если после ремапа и полного цикла P2-ветка не даёт роста в бакетах <16 и 16-32 px;
#   3) если на целевом GPU (не на этой машине!) 36 камер x 2 fps в fp16 всё-таки не укладываются;
#   4) если нужен «drop-in» без переаттестации всей инференс-обвязки: форма выхода и число якорей те же, что у прода.

# Parameters
nc: 1 # uav; 'bird' как hard-negative -> nc: 2, ширина головы не меняется
end2end: True # NMS-free
reg_max: 1 # прямая регрессия ltrb без DFL
scales: # [depth, width, max_channels]; summary измерено на этом файле при nc=1
  n: [0.50, 0.25, 1024] # summary: 265 layers, 2,513,214 parameters, 6.2 GFLOPs@640, 26.2 @1280, deploy 13.2 @736x1280, c2/c3 16/64
  s: [0.50, 0.50, 1024] # summary: 265 layers, 9,983,070 parameters, 23.8 GFLOPs@640, 98.3 @1280, deploy 50.9 @736x1280, c2/c3 32/128  <- РАБОЧИЙ
  m: [0.50, 1.00, 512] # summary: 285 layers, 21,908,830 parameters, 79.2 GFLOPs@640, 319.9 @1280, deploy 167.0 @736x1280, c2/c3 64/256
  l: [1.00, 1.00, 512] # summary: 397 layers, 26,312,286 parameters, 97.8 GFLOPs@640, 395.5 @1280, deploy 209.7 @736x1280, c2/c3 64/256

# Backbone: 1:1 с yolo26.yaml, слои 0-10 переносятся без ремапа
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 — источник деталей stride 4 для слоя 15
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 — плотный Conv намеренно: SCDown тут стоил бы ~1.6M предобученных весов
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 — контекст неба против облаков/птиц/огней, 1600 токенов при 1280

# Head: топология yolo26 плюс один слой инъекции P2 -> всё после 14 сдвинуто ровно на 1
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 (P4/16 top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [2, 1, SCDown, [256, 3, 2]] # 15 — backbone P2/4 -> stride 8 обучаемым сжатием (1x1 + dw3x3/s2), а не ещё одним уровнем Detect
  - [[14, 4, 15], 1, Concat, [1]] # 16 — top-down P4 + backbone P3 + детали P2; индексы явные, т.к. -1 указывал бы на SCDown
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small) — вход Detect слот 0, задаёт c2/c3 = 32/128 на s

  - [-1, 1, Conv, [256, 3, 2]] # 18 <- yolo26 слой 17
  - [[-1, 13], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium) <- yolo26 слой 19

  - [-1, 1, Conv, [512, 3, 2]] # 21 <- yolo26 слой 20
  - [[-1, 10], 1, Concat, [1]] # 22 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large) <- yolo26 слой 22

  - [[17, 20, 23], 1, Detect, [nc]] # 24 Detect(P3, P4, P5) — strides [8, 16, 32], форма выхода как у прода
