# YOLO26 + уровень P2/4 для малых БПЛА на статичных «небесных» камерах (кадр 1920x1080, imgsz 1280, TensorRT fp16).
# РЕШЕНИЕ. Цель ~16 px в кадре = ~10 px в сети: 1.25 ячейки при stride 8 против 2.5 при stride 4 — отсюда уровень P2.
# Но ширина головы считается ТОЛЬКО от самого мелкого входа: c2 = max(16, ch[0]//4, 4*reg_max), c3 = max(ch[0], min(nc,100)).
# Поэтому узел P2 (слой 19) выдаёт 256*w, а не 128*w как в штатном yolo26-p2: Detect остаётся 32/128 на scale s, а не 16/64.
# Ложные тревоги (птицы, облака, огни) — враг №1, а c3 — это ширина всей cls-башни (DWConv+Conv+DWConv+Conv), не только финального 1x1.
# Доплата окупается: 66.5 GFLOPs на реальной форме 736x1280 против 156.2 у нынешнего YOLO11m P3-P5 — запас по FPS больше двух раз.
#
# ИЗМЕРЕНО (nc=1, thop, DetectionModel; GF@640 / GF@1280 — квадратный вход, unfused, обе башни Detect.
# «deploy» — fused (one2many удалён), реальный letterbox 736x1280 для кадра 1920x1080 — это и есть число под TensorRT):
#   scale s: 10,258,600 par, 35.1 / 143.3 GF, deploy 66.5 GF, c2/c3 = 32/128, strides [4,8,16,32], 78,200 якорей @736x1280
#   ориентиры (те же замеры): yolo26s 9,948,638 / 22.7 / 93.9 / deploy 48.5 / 32/128
#                             yolo26s-p2 9,663,464 / 26.6 / 109.4 / deploy 56.7 / 16/64  <- ловушка головы во всей красе
#                             YOLO11m P3-P5 (стоит в проде) 20,053,779 / 68.3 / 274.7 / deploy 156.2 / 64/256
#                             черновик yolo11m-p2 21,794,132 / 119.2 / 478.2 / deploy 272.1 — в 4.1 раза дороже этого файла
#   перенос yolo26s.pt (scale s): 59.0 % «как есть», 98.6 % после ремапа ключей, one2one 99.9 % — ремап обязателен, см. RECIPE-uav.md
#   ONNX opset 19: 1x3x736x1280 -> (1, 300, 6), 842 узла, onnx.checker OK; ноды только Conv/Resize/Concat/MatMul/TopK/Sigmoid — TRT-friendly
#
# ОБУЧАТЬ И ДЕПЛОИТЬ НА scale s. m/l приведены для полноты и по стоимости выходят за бюджет 36 камер x 2 fps (см. summary).
# ИМЯ ФАЙЛА: yaml_model_load срезает букву масштаба (yolo26s-uav.yaml -> yolo26-uav.yaml), поэтому оба имени должны
# лежать рядом; никогда не называть файл yolo26s-p2.yaml и т.п. — тогда молча подтянется бандл ultralytics.

# Parameters
nc: 1 # uav; 'bird' как hard-negative -> nc: 2, на ширину головы не влияет (c3 = max(ch[0], min(nc,100)), ch[0] = 128 при s)
end2end: True # NMS-free: на инференсе работает только one2one, one2many живёт до fuse()
reg_max: 1 # прямая регрессия ltrb без DFL — вся точность box держится на c2, поэтому c2=32, а не 16
scales: # [depth, width, max_channels]; summary измерено на этом файле при nc=1
  n: [0.50, 0.25, 1024] # summary: 332 layers, 2,584,168 parameters, 9.1 GFLOPs@640, 38.0 @1280, deploy 17.2 @736x1280, c2/c3 16/64
  s: [0.50, 0.50, 1024] # summary: 332 layers, 10,258,600 parameters, 35.1 GFLOPs@640, 143.3 @1280, deploy 66.5 @736x1280, c2/c3 32/128  <- РАБОЧИЙ
  m: [0.50, 1.00, 512] # summary: 352 layers, 22,994,408 parameters, 123.2 GFLOPs@640, 495.6 @1280, deploy 228.9 @736x1280, c2/c3 64/256 (1.5x прода — не брать)
  l: [1.00, 1.00, 512] # summary: 492 layers, 27,673,832 parameters, 147.6 GFLOPs@640, 595.0 @1280, deploy 285.0 @736x1280, c2/c3 64/256 (1.8x прода — не брать)

# Backbone: 1:1 с yolo26.yaml — слои 0-10 переносятся из yolo26s.pt по именам и формам без ремапа
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 — вход уровня P2 в шею
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 — плотный Conv намеренно: здесь решается, доживёт ли деталь 10-px цели до P3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 — SCDown здесь НЕ ставим: он выкидывает ~1.6M предобученных весов
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 — внимание только тут: при 1280 это 1600 токенов; на P4 было бы 6400 и карта 6400x6400

# Head: слои 11-16 тоже 1:1 с yolo26.yaml, дальше уровень P2 и восходящий путь
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 (P4/16 top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8 top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [256, True, 0.25]] # 19 (P2/4-xsmall) — 256, НЕ 128: этот выход задаёт c2/c3 головы на ВСЕХ уровнях.
  # e=0.25 (а не 0.5) держит скрытую ширину блока такой же, как в штатном yolo26-p2, — блок сидит на карте 320x320 при 1280.
  # Замерено: e=0.5 даёт 156.3 GF@1280 / deploy 73.9 при точно той же голове 32/128, т.е. e=0.25 экономит 10 % deploy даром

  - [-1, 1, SCDown, [128, 3, 2]] # 20 — спуск P2->P3: единственный Conv 3x3/s2 на карте 320x320. SCDown (1x1 + dw3x3/s2)
  # дешевле и экспортируется обычными свёртками; замерено: Conv здесь даёт 145.4 GF@1280 / deploy 67.7 против 143.3 / 66.5.
  # Путь вторичный (у P3 уже есть свой backbone-вход и top-down контекст), поэтому экономия тут безопасна
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small) — основная масса целей 16-32 px

  - [-1, 1, Conv, [256, 3, 2]] # 23 — плотный Conv: карта уже 160x160, экономить нечего, зато веса переносятся из yolo26s.pt (слой 17)
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium) <- yolo26 слой 19

  - [-1, 1, Conv, [512, 3, 2]] # 26 <- yolo26 слой 20
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large) <- yolo26 слой 22; голову P5 НЕ выкидываем:
  # замерено, что удаление даёт ~0 GFLOPs, а бьёт по бакету >100 px, где сейчас единственный работающий recall 86.2 %

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5) — порядок входов строго по возрастанию stride: [4, 8, 16, 32]
