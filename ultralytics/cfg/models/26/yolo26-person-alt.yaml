# YOLO26 «person-alt»: то же, что yolo26-person.yaml, ПЛЮС путь со страйда 4 в шею P3 (слои 15-17).
# РАЗВИЛКА: yolo26-person отвечает «ёмкость на stride 8», этот файл — «в P3 не хватает самой детали 4-px сетки».
# Берите alt, только если таблица recall по бакетам высоты GT (<12 / 12-16 / 16-32 / 32-50 px) на текущей модели
# 0.794 показывает провал именно в бакетах <16 px. Цена: 101.6 против 99.4 GF@1280 (94.7 против 92.5 «только one2one»)
# и — главное — вставленный слой 15 сдвигает всю шею на +1, поэтому .load('yolo26s.pt') БЕЗ переименования ключей
# даёт 58.2% весов и 0.0% башен one2one. С переименованием model.i -> model.(i+1) для i >= 15: 97.4% и 99.9% (замер).

# ИЗМЕРЕНО (scale s, nc=1, thop; GF@1280 «полная модель / только one2one как в экспорте»):
#   yolo26 (база)          9 948 638 п.,  93.9 / 87.1, перенос 100%   — контроль
#   yolo26-person          10 055 838 п., 99.4 / 92.5, перенос 98.2%  — основной арм, переименований не нужно
#   ЭТОТ ФАЙЛ              10 073 054 п., 101.6 / 94.7, перенос 97.4% (с офсетом +1), one2one 99.9%
#   бюджетный вариант: вернуть слою 17 repeats 2 (вместо 4) -> 98.8 / 92.0 GF, перенос 98.1% — ровно бюджет
#     основного арма, т.е. чистый обмен «глубина шеи P3» <-> «детали со страйда 4», если нужен строгий A/B.
# SCDown в слое 15 — единственная новая операция относительно задеплоенного графа (1x1 + depthwise 3x3 s2, act=False).
# ШЛЮЗ ДЛЯ int8: per-tensor int8 на depthwise stride-2 — классический обрыв точности. Перед выпуском .mlpackage int8
# проверить пооперационную ошибку на слое 15 и при просадке оставить его в fp16 / перейти на per-channel.
# Плотный Conv вместо SCDown измерен: 103.6 / 96.8 GF, перенос 96.8% — берите, если int8-проверка не нравится.
# ИМЯ ФАЙЛА: обучать через 'yolo26s-person-alt.yaml' (буква масштаба обязана быть в имени, иначе соберётся scale n).

# Parameters
nc: 1 # person
end2end: True # NMS-free голова one2one
reg_max: 1 # прямая ltrb-регрессия без DFL
scales: # [depth, width, max_channels]; summary = DetectionModel(nc=1).info(imgsz=...)
  n: [0.50, 0.25, 1024] # summary: 283 layers, 2,535,678 parameters, 6.4 GFLOPs@640, 27.0 GFLOPs@1280; Detect c2/c3 = 16/64
  s: [0.50, 0.50, 1024] # summary: 283 layers, 10,073,054 parameters, 24.7 GFLOPs@640, 101.6 GFLOPs@1280 (94.7 только one2one); Detect c2/c3 = 32/128
  m: [0.50, 1.00, 512] # summary: 313 layers, 22,302,430 parameters, 83.0 GFLOPs@640, 335.0 GFLOPs@1280; Detect c2/c3 = 64/256 — при 1280 нереалистично
  l: [1.00, 1.00, 512] # summary: 453 layers, 27,166,686 parameters, 107.5 GFLOPs@640, 434.3 GFLOPs@1280; Detect c2/c3 = 64/256 — при 1280 нереалистично

# Backbone: индексы и ширины yolo26 (0-10 переносятся из yolo26s.pt как есть)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 — карта stride 4, источник детали для слоя 15
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 4, C3k2, [512, False, 0.25]] # 4 — было 2: ствол P3 вдвое глубже
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 — внимание только здесь (1600 токенов при 1280)

# Head: PAN yolo26 + инъекция P2-детали в конкат P3 (слои 15-16); индексы 15+ сдвинуты на +1 относительно yolo26
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 (P4/16 top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [2, 1, SCDown, [128, 3, 2]] # 15 — P2/4 -> stride 8, 64 канала при s: обучаемое сжатие 320x320 -> 160x160
  - [[14, 4, 15], 1, Concat, [1]] # 16 cat: P4 top-down + backbone P3 + деталь со страйда 4
  - [-1, 4, C3k2, [256, True]] # 17 (P3/8-small) — было 2 повтора: основной уровень для 10-40 px

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large) — не облегчаем: ширина задаёт вход Detect P5

  - [[17, 20, 23], 1, Detect, [nc]] # 24 Detect(P3, P4, P5), strides 8/16/32; перенос весов только с офсетом +1 для i >= 15
