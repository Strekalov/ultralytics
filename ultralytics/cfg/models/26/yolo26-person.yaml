# YOLO26 «person»: поиск людей 10-40 px на аэроснимках SAR (HERIDAL / LADD / Mavic), патчи 1152-1280, один класс.
# РЕШЕНИЕ: топологию yolo26 не меняем — три уровня P3/8-P5/32, 33 600 якорей при 1280, Detect c2/c3 = 32/128 и
# входы Detect [128, 256, 512] бит-в-бит как у yolo26s. Поэтому .load('yolo26s.pt') переносит 98.2% весов, а башни
# one2one — 99.9% (кроме 1x1 cls-свёртки, она всё равно новая при nc=1) БЕЗ переименования ключей чекпоинта.
# Всё изменение — глубина двух блоков на stride 8 (слои 4 и 16, repeats 2->4): человек 10-40 px это 1.25-5 ячеек P3,
# узкое место здесь не плотность якорей, а качество признаков и ёмкость на том единственном уровне, где живут цели.

# ЧТО ИЗМЕРЕНО И СОЗНАТЕЛЬНО ОТВЕРГНУТО (scale s, nc=1, thop; GF@1280 «полная модель / только one2one как в экспорте»):
#   yolo26 (база)                                    9 948 638 п.,  93.9 / 87.1 — контроль
#   ЭТОТ ФАЙЛ                                       10 055 838 п.,  99.4 / 92.5, перенос 98.2%, one2one 99.9%
#   + уровень P2 в Detect (yolo26-p2 и производные)  до 145.4 / 121.4, 136 000 якорей, перенос 58.6% — ОТВЕРГНУТО:
#     4x якорей при tal_topk=1 в one2one — это ровно тот механизм, который порождает почти-дубликаты в проде.
#   + расширение головы до c2/c3 48/192               112.6 / 99.5, перенос 74.5% — ОТВЕРГНУТО: голова Detect
#     инициализируется заново, т.е. выбрасывается уже откалиброванная one2one-ветвь ради непроверенной гипотезы.
#   - облегчение блока P5 (слой 22 -> [512, True])     92.4 / 85.9 — ОТВЕРГНУТО: меняет вход Detect P5 512->256,
#     из-за чего переносится лишь 69.5% башен one2one (замер). 7 GF@1280 не стоят трети обученной one2one-головы.
#   - SCDown вместо плотных Conv на слоях 7 и 20       96.3 / 89.5, перенос 95.4% — запасной рычаг, если упрётесь
#     в FPS: -3.1 GF@1280 и -1.56M параметров, но два depthwise-stride-2 в int8-графе (проверять по-операционно).
# Новых типов операций нет: граф экспорта совпадает с уже задеплоенным yolo26s (CoreML fp16/int8, TensorRT).
# ИМЯ ФАЙЛА: guess_model_scale ищет 'yolo\d+[nslmx]' в stem, поэтому 'yolo26-person.yaml' соберётся как scale n
# с одним WARNING. Обучать только через 'yolo26s-person.yaml' (файл рядом может не существовать: yaml_model_load
# сам срежет букву масштаба и найдёт этот файл). Не называть файл именем бандла (yolo26s-p2.yaml и т.п.).

# Parameters
nc: 1 # person
end2end: True # NMS-free голова one2one (как во всём семействе YOLO26)
reg_max: 1 # прямая ltrb-регрессия без DFL
scales: # [depth, width, max_channels]; summary = DetectionModel(nc=1).info(imgsz=...)
  n: [0.50, 0.25, 1024] # summary: 278 layers, 2,531,166 parameters, 6.2 GFLOPs@640, 26.4 GFLOPs@1280; Detect c2/c3 = 16/64
  s: [0.50, 0.50, 1024] # summary: 278 layers, 10,055,838 parameters, 24.1 GFLOPs@640, 99.4 GFLOPs@1280 (92.5 только one2one); Detect c2/c3 = 32/128
  m: [0.50, 1.00, 512] # summary: 308 layers, 22,235,230 parameters, 80.9 GFLOPs@640, 326.5 GFLOPs@1280; Detect c2/c3 = 64/256 — при 1280 нереалистично
  l: [1.00, 1.00, 512] # summary: 448 layers, 27,099,486 parameters, 105.3 GFLOPs@640, 425.7 GFLOPs@1280; Detect c2/c3 = 64/256 — при 1280 нереалистично

# Backbone: индексы и ширины yolo26 -> перенос весов по именам model.N.*
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 — не углубляем: самая ранняя и самая переносимая стадия
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 (плотный: здесь решается, доживёт ли деталь 10 px до P3)
  - [-1, 4, C3k2, [512, False, 0.25]] # 4 — было 2: ствол P3 вдвое глубже, в одиночку +2.8 GF@1280 (s) и перенос 99.0%
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 — внимание только здесь (1600 токенов при 1280): контекст просеки/опушки/скалы

# Head: PAN как в yolo26, индексы 11-22 сохранены ради переноса весов
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 (P4/16 top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 4, C3k2, [256, True]] # 16 (P3/8-small) — было 2: блок, который Detect видит напрямую; +2.7 GF@1280 (s)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium) — цели 30-40 px и контекст

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large) — оставлен как есть: его ширина задаёт вход Detect P5

  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5), strides 8/16/32; индекс 23 = как в yolo26 -> .load() без переименований
